apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mysql2
  namespace: micro-services
spec:
  serviceName: mysql2
  replicas: 2
  selector:
    matchLabels:
      app: mysql2
  template:
    metadata:
      labels:
        app: mysql2
    spec:
      containers:
        - name: mysql2
          image: mysql:9.2
          ports:
            - containerPort: 3306
          env:
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: db-credentials
                  key: db_password
            - name: MYSQL_PASSWORD # Set password for root1 user
              valueFrom:
                secretKeyRef:
                  name: db-credentials
                  key: db_password # Password for root1 user
          volumeMounts:
            - name: mysql-data
              mountPath: /var/lib/mysql
            - name: sql-scripts2
              mountPath: /docker-entrypoint-initdb.d
      volumes:
        - name: sql-scripts2
          configMap:
            name: mysql-init-scripts2
  volumeClaimTemplates:
    - metadata:
        name: mysql-data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 10Gi
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: mysql-init-scripts2
  namespace: micro-services
data:
  commande_dump.sql: |
    CREATE DATABASE IF NOT EXISTS commande;
     USE commande;
     DROP TABLE IF EXISTS `commande`;
     CREATE TABLE `commande` (
       `id` int NOT NULL AUTO_INCREMENT,
       `user_id` int NOT NULL,
       `panier_id` int NOT NULL,
       `quantité` int NOT NULL,
       `prix` double NOT NULL,
       `statut` varchar(50) DEFAULT 'Pending',
       `date` timestamp NULL DEFAULT NULL,
       PRIMARY KEY (`id`)
     ) ENGINE=InnoDB AUTO_INCREMENT=53 DEFAULT CHARSET=utf8mb4 COLLATE=utf8mb4_0900_ai_ci;
     --
     -- Dumping data for table `commande`
     --

     LOCK TABLES `commande` WRITE;

     INSERT INTO `commande` VALUES (49,1,3,2,5.98,'Completed','2025-01-11 14:08:50'),(50,1,300,2,0,'CANCELLED','2025-01-11 14:11:03'),(51,1,3,200,0,'CANCELLED','2025-01-11 14:13:04'),(52,1,3,2,5.98,'Completed','2025-01-11 14:13:43');

    UNLOCK TABLES;

---
apiVersion: v1
kind: Service
metadata:
  name: mysql2
  namespace: micro-services
spec:
  selector:
    app: mysql2
  ports:
    - protocol: TCP
      port: 3306
      targetPort: 3306
  type: NodePort

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ms-commande
  namespace: micro-services
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ms-commande
  template:
    metadata:
      labels:
        app: ms-commande
    spec:
      containers:
        - name: commande
          image: idriss5234/ms_commande:latest
          ports:
            - containerPort: 8092
          env:
            - name: DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: db-credentials
                  key: db_username # root1 user from secret
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: db-credentials
                  key: db_password # root1 password from secret
---
apiVersion: v1
kind: Service
metadata:
  name: ms-commande
  namespace: micro-services
spec:
  selector:
    app: ms-commande
  ports:
    - protocol: TCP
      port: 8092
      targetPort: 8092
  type: NodePort
