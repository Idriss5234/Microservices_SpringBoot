- name: Start docker containers
  hosts: all
  vars_files:
    - vars.yaml
  gather_facts: False
  become: yes
  tasks:
    - name: Docker login
      docker_login:
        registry_url: "https://index.docker.io/v1/"
        username: "{{ docker_username }}"
        password: "{{ docker_password }}"

    - name: Start global docker containers
      docker_compose:
        project_src: "/home/ec2-user/micro-services/docker-compose1.yml"

    - name: Start ms_commande containers
      docker_compose:
        project_src: "/home/ec2-user/micro-services/ms_commande/docker-compose2.yml"

    - name: Start ms_utilisateur containers
      docker_compose:
        project_src: "/home/ec2-user/micro-services/ms_utilisateur/docker-compose.yml"

    - name: Start ms_panier containers
      docker_compose:
        project_src: "/home/ec2-user/micro-services/ms_panier/docker-compose.yml"
