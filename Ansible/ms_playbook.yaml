            src: "C:\\Users\\ADMIN\\Desktop\\micro-services\\docker-compose.yaml",
            dest: "/home/ec2-user/micro-services/docker-compose1.yml",
          }
        - {
            src: "C:\\Users\\ADMIN\\Desktop\\micro-services\\micro-service-commande\\docker-compose.yaml",
