      file:
        path: "/home/ec2-user/micro-services/ms_commande"
        state: directory
        mode: "0755"

    - name: Copy docker-compose files for ms_commande
      win_copy:
        src: "{{ item.src }}"
        dest: "{{ item.dest }}"
      with_items:
