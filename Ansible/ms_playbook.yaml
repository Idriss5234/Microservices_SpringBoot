- name: Wait for ssh connection
  hosts: all
  gather_facts: False
  tasks:
    - name: Wait for SSH to come up
      wait_for:
        host: "{{ (ansible_ssh_host)|default(ansible_host)|default(inventory_hostname) }}"
        port: 22
        delay: 60
        timeout: 300
        search_regex: OpenSSH
      vars:
        ansible_connection: local

- name: Install packages
  hosts: all
  become: yes
  gather_facts: False
  tasks:
    - name: Install python3 & docker
      yum:
        name:
          - python3
          - docker
        state: present
        update_cache: yes
      vars:
        ansible_python_interpreter: /usr/bin/python
    - name: Install docker-compose
      shell: curl -L https://github.com/docker/compose/releases/download/1.7.0-rc1/docker-compose-`uname -s`-`uname -m` > /usr/local/bin/docker-compose
    - name: Permissions docker-compose
      shell: chmod +x /usr/local/bin/docker-compose

- name: Start docker service
  hosts: all
  become: yes
  gather_facts: False
  tasks:
    - name: Start docker service
      service:
        name: docker
        state: started
        enabled: yes

- name: Add ec2-user to docker group
  hosts: all
  become: yes
  gather_facts: False
  tasks:
    - name: Add ec2-user to docker group
      user:
        name: ec2-user
        groups: docker
        append: yes
    - name: Reconnect after group change
      meta: reset-connection

- name: Copy docker-compose files
