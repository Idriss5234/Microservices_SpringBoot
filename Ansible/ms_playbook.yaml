            dest: "/home/ec2-user/micro-services/ms_commande/commande_dump.sql",
          }

    - name: Create directories for ms_utilisateur
      file:
        path: "/home/ec2-user/micro-services/ms_utilisateur"
        state: directory
        mode: "0755"

    - name: Copy docker-compose files for ms_utilisateur
      win_copy:
